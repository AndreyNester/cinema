jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------
      # 1) Build images locally (no push) — чтобы docker-compose мог их использовать
      # ---------------------------
      - name: Build Monolith (local, no push)
        uses: docker/build-push-action@v4
        with:
          context: ./src/monolith
          push: false
          load: true
          tags: monolith:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Movies Service (local, no push)
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/movies
          push: false
          load: true
          tags: movies-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Proxy Service (local, no push)
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/proxy
          push: false
          load: true
          tags: proxy-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Events Service (local, no push)
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/events
          push: false
          load: true
          tags: events-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------
      # 2) Run api-tests (docker-compose + newman)
      # ---------------------------
      - name: Start services with docker compose
        run: |
          docker compose up -d
          docker compose ps

      - name: Wait for gateway to be ready
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "Gateway is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Gateway did not become ready in time"
          docker compose logs --no-color || true
          exit 1

      - name: Set up Node (for newman)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install newman
        run: npm i -g newman

      - name: Run Postman api-tests
        run: |
          set -e
          ls -la tests/postman || true

          # 1) Если есть env-файл — используем, если нет — запускаем без него
          ENV_FILE=""
          if ls tests/postman/*environment*.json >/dev/null 2>&1; then
            ENV_FILE="$(ls tests/postman/*environment*.json | head -n 1)"
            echo "Using env: $ENV_FILE"
          else
            echo "No environment file found, running without -e"
          fi

          # 2) Запускаем все коллекции (часто их несколько)
          COLLECTIONS=$(ls tests/postman/*collection*.json 2>/dev/null || true)
          if [ -z "$COLLECTIONS" ]; then
            # fallback: любые json в папке
            COLLECTIONS=$(ls tests/postman/*.json 2>/dev/null || true)
          fi

          if [ -z "$COLLECTIONS" ]; then
            echo "No Postman collections found in tests/postman"
            exit 1
          fi

          for c in $COLLECTIONS; do
            echo "Running collection: $c"
            if [ -n "$ENV_FILE" ]; then
              newman run "$c" -e "$ENV_FILE"
            else
              newman run "$c"
            fi
          done

      - name: Stop services
        if: always()
        run: |
          docker compose logs --no-color || true
          docker compose down -v

      # ---------------------------
      # 3) Only if tests are green — build & push to GHCR
      # ---------------------------
      - name: Extract metadata (tags, labels) for Monolith
        id: meta-monolith
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.MONOLITH_IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Monolith Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/monolith
          push: true
          tags: ${{ steps.meta-monolith.outputs.tags }}
          labels: ${{ steps.meta-monolith.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (tags, labels) for Movies Service
        id: meta-movies
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.MOVIES_SERVICE_IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Movies Service Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/movies
          push: true
          tags: ${{ steps.meta-movies.outputs.tags }}
          labels: ${{ steps.meta-movies.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (tags, labels) for Proxy Service
        id: meta-proxy
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROXY_SERVICE_IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Proxy Service Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/proxy
          push: true
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (tags, labels) for Events Service
        id: meta-events
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.EVENTS_SERVICE_IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Events Service Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/events
          push: true
          tags: ${{ steps.meta-events.outputs.tags }}
          labels: ${{ steps.meta-events.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
