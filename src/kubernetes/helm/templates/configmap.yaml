apiVersion: v1
kind: ConfigMap
metadata:
  name: cinemaabyss-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # Database configuration
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  DB_USER: {{ .Values.database.user | quote }}

  # Service URLs
  MONOLITH_URL: "http://monolith:{{ .Values.monolith.service.port }}"
  MOVIES_SERVICE_URL: "http://movies:{{ .Values.moviesService.service.port }}"
  
  # Strangler Fig configuration
  GRADUAL_MIGRATION: {{ .Values.config.gradualMigration | quote }}
  MOVIES_MIGRATION_PERCENT: {{ .Values.config.moviesMigrationPercent | quote }}
  
  kong.yml: |
    _format_version: "3.0"
    
    upstreams:
      - name: movies_upstream
        targets:
          - target: movies-service:8081
            weight: {{ .Values.config.moviesMigrationPercent | quote }}
          - target: monolith:8080
            weight: {{ sub 100 .Values.config.moviesMigrationPercent }}
    
    services:
      - name: movies-gateway
        host: movies_upstream
        port: 80
        protocol: http
        routes:
          - name: movies-route
            paths:
              - /api/movies
            strip_path: false
    
      # всё остальное -> монолит
      - name: monolith-gateway
        url: http://monolith:8080
        routes:
          - name: monolith-route
            paths:
              - /
            strip_path: false
